name: Posterum RustDesk Windows x64

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SCITER_RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.4.9"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: Windows x64
    needs:
      - generate-bridge
      - topmost-window

    runs-on: windows-2022

    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout RustDesk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Patch Posterum server settings into Config layer
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/core_main.rs")
          text = path.read_text(encoding="utf-8")

          start = text.find('    crate::load_custom_client();\n    // Posterum-IT: force custom RustDesk server settings')
          end_marker = '    #[cfg(windows)]\n    if !crate::platform::windows::bootstrap()'
          end = text.find(end_marker, start)

          if start < 0 or end < 0:
              raise RuntimeError("Posterum server settings block was not found in src/core_main.rs")

          new = '''    crate::load_custom_client();

              // Posterum-IT: configure the rendezvous stack directly through Config.
              config::Config::set_option(
                  "custom-rendezvous-server".to_owned(),
                  "desk.posterum-it.ru".to_owned(),
              );
              config::Config::set_option(
                  "relay-server".to_owned(),
                  "desk.posterum-it.ru".to_owned(),
              );
              config::Config::set_option(
                  "api-server".to_owned(),
                  "https://desk.posterum-it.ru".to_owned(),
              );
              config::Config::set_option(
                  "key".to_owned(),
                  "csgXC8Lauk982hYBWiTdMSEtwFa+h2VBPsvqLB5cO5U=".to_owned(),
              );

              '''

          path.write_text(text[:start] + new + text[end:], encoding="utf-8")

      - name: Patch installed main IPC for cross-session GUI
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ipc/auth.rs")
          text = path.read_text(encoding="utf-8")

          old = '''    if !authorized {
        log_rejected_windows_ipc_connection(
            postfix,
            peer_pid,
            peer_session_id,
            server_session_id,
            peer_is_system,
            peer_is_elevated,
        );
        return false;
    }
    if let Err(err) = ensure_peer_executable_matches_current_by_pid_opt(peer_pid, postfix) {
        log::warn!(
            "Rejected unauthorized connection on ipc channel due to executable mismatch: postfix={}, peer_pid={:?}, err={}",
            postfix,
            peer_pid,
            err
        );
        return false;
    }
    true
'''

          new = '''    // Posterum-IT: on some installed Windows systems RustDesk launches the
    // privileged --server process in a different Windows session than tray/GUI.
    // Keep the normal session check, but for the main IPC channel allow the
    // installed RustDesk executable itself across that session boundary.
    // Executable-path verification remains mandatory; arbitrary processes are rejected.
    if !authorized {
        if postfix.is_empty() && crate::platform::is_installed() {
            if ensure_peer_executable_matches_current_by_pid_opt(peer_pid, postfix).is_ok() {
                log::debug!(
                    "Posterum-IT: allowing installed same-executable IPC across Windows sessions: peer_pid={:?}, peer_session_id={:?}, server_session_id={:?}",
                    peer_pid,
                    peer_session_id,
                    server_session_id
                );
                return true;
            }
        }
        log_rejected_windows_ipc_connection(
            postfix,
            peer_pid,
            peer_session_id,
            server_session_id,
            peer_is_system,
            peer_is_elevated,
        );
        return false;
    }
    if let Err(err) = ensure_peer_executable_matches_current_by_pid_opt(peer_pid, postfix) {
        log::warn!(
            "Rejected unauthorized connection on ipc channel due to executable mismatch: postfix={}, peer_pid={:?}, err={}",
            postfix,
            peer_pid,
            err
        );
        return false;
    }
    true
'''

          if old not in text:
              raise RuntimeError("Windows main IPC authorization block was not found in src/ipc/auth.rs")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Download Flutter bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace Flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release

          Move-Item `
            -Force `
            windows-x64-release/* `
            C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then

            find "${VCPKG_ROOT}/" -name "*.log" | while read -r logfile; do
              echo "$logfile:"
              cat "$logfile"
            done

            exit 1
          fi

      - name: Build RustDesk Windows x64
        shell: powershell
        run: |
          python3 .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec `
            --vram

          Move-Item `
            ./flutter/build/windows/x64/runner/Release `
            ./rustdesk

      - name: Add virtual display driver
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip `
            -OutFile usbmmidd_v2.zip

          Expand-Archive usbmmidd_v2.zip -DestinationPath .

          Remove-Item usbmmidd_v2\Win32 -Recurse
          Remove-Item `
            usbmmidd_v2\deviceinstaller64.exe, `
            usbmmidd_v2\deviceinstaller.exe, `
            usbmmidd_v2\usbmmidd.bat

          Move-Item -Force .\usbmmidd_v2 ./rustdesk

      - name: Download TopMost DLL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")

          if [ "$runner_res" != "" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Build portable EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml

          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py \
            -f ../../rustdesk/ \
            -o . \
            -e ../../rustdesk/rustdesk.exe
          popd

          mkdir -p ./output

          mv \
            ./target/release/rustdesk-portable-packer.exe \
            ./output/Posterum-RustDesk-x64.exe

      - name: Upload Posterum RustDesk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Posterum-RustDesk-Windows-x64
          path: ./output/Posterum-RustDesk-x64.exe
          if-no-files-found: error